<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heater Tube DN300 SCH10 - SUS304</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e2a33; font-family: Arial, sans-serif; }
  #c3d { width: 100%; height: 100%; display: block; }
  #ui { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #ui button { padding: 8px 12px; border: 1px solid #5b7080; background: #2b3b47; color: #fff; border-radius: 6px; cursor: pointer; }
  #ui button:hover { background: #38505f; }
  #ui span { color: #b8c4cc; font-size: 13px; }
  #info { position: fixed; bottom: 12px; left: 12px; color: #dfe7ec; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="ui">
  <button id="bAuto">Dừng tự xoay</button>
  <button id="bIso">Góc nhìn 3D</button>
  <button id="bSide">Nhìn ngang</button>
  <button id="bFront">Nhìn bích tròn</button>
  <button id="bBack">Nhìn bích vuông</button>
  <span>Kéo chuột để xoay, cuộn để thu phóng</span>
</div>
<div id="info">Heater Tube<br>Bích tròn DN300 JIS 10K + bích vuông 642,4 x 642,4<br>Material: SUS304<br>Q'ty: 1 Pc</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
var canvas = document.getElementById('c3d');
var renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x1e2a33, 1);
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(35, 1, 10, 20000);

function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 0.9));
var d1 = new THREE.DirectionalLight(0xffffff, 0.9); d1.position.set(800, 1200, 900); scene.add(d1);
var d2 = new THREE.DirectionalLight(0xffffff, 0.5); d2.position.set(-900, -300, -700); scene.add(d2);

var steel = new THREE.MeshStandardMaterial({color: 0xc4cad0, metalness: 0.55, roughness: 0.38, side: THREE.DoubleSide});
var flangeMat = new THREE.MeshStandardMaterial({color: 0xb4bbc2, metalness: 0.55, roughness: 0.42});
var plateMat = new THREE.MeshStandardMaterial({color: 0xaab2ba, metalness: 0.55, roughness: 0.45});
var g = new THREE.Group();

var R = 161.95;      // bán kính ngoài ống DN300
var T1 = 24;         // dày bích tròn
var SQ = 642.4, T2 = 20;
var END = 124;       // ống kết thúc tại mặt ngoài bích vuông
var X2 = END - T2;

function holeCircle(s, cx, cy, r){
  var hp = new THREE.Path(); hp.absarc(cx, cy, r, 0, Math.PI * 2, true); s.holes.push(hp);
}
function extrude(shape, depth, x, mat){
  var m = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, {depth: depth, bevelEnabled: false, curveSegments: 48}), mat);
  m.rotation.y = Math.PI / 2; m.position.x = x; return m;
}

// Ống: từ bích tròn đến hết bích vuông (không có đáy, không có ống phi 34)
var pipe = new THREE.Mesh(new THREE.CylinderGeometry(R, R, END, 72, 1, true), steel);
pipe.rotation.z = -Math.PI / 2; pipe.position.x = END / 2; g.add(pipe);

// Bích tròn DN300 JIS 10K
var s1 = new THREE.Shape(); s1.absarc(0, 0, 222.5, 0, Math.PI * 2, false);
holeCircle(s1, 0, 0, R);
for (var k = 0; k < 16; k++) {
  var an = k / 16 * Math.PI * 2;
  holeCircle(s1, Math.cos(an) * 200, Math.sin(an) * 200, 11.5);
}
g.add(extrude(s1, T1, 0, flangeMat));

// Bích vuông 642,4 x 642,4 (mặt ngoài trùng đầu ống)
var s2 = new THREE.Shape();
s2.moveTo(-SQ / 2, -SQ / 2); s2.lineTo(SQ / 2, -SQ / 2); s2.lineTo(SQ / 2, SQ / 2); s2.lineTo(-SQ / 2, SQ / 2); s2.lineTo(-SQ / 2, -SQ / 2);
holeCircle(s2, 0, 0, R);
g.add(extrude(s2, T2, X2, plateMat));

g.position.x = -END / 2;
scene.add(g);

var ctl = new THREE.OrbitControls(camera, canvas);
ctl.enableDamping = true; ctl.autoRotate = true; ctl.autoRotateSpeed = 1.2;
function view(x, y, z){ camera.position.set(x, y, z); ctl.target.set(0, 0, 0); ctl.update(); }
view(700, 450, 1000);

var bAuto = document.getElementById('bAuto');
function stopAuto(){ ctl.autoRotate = false; bAuto.textContent = 'Bật tự xoay'; }
bAuto.onclick = function(){ ctl.autoRotate = !ctl.autoRotate; bAuto.textContent = ctl.autoRotate ? 'Dừng tự xoay' : 'Bật tự xoay'; };
document.getElementById('bIso').onclick = function(){ view(700, 450, 1000); };
document.getElementById('bSide').onclick = function(){ stopAuto(); view(0, 0, 1500); };
document.getElementById('bFront').onclick = function(){ stopAuto(); view(-1500, 40, 40); };
document.getElementById('bBack').onclick = function(){ stopAuto(); view(1500, 40, 40); };

(function loop(){ requestAnimationFrame(loop); ctl.update(); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
